syntax = "proto3";

package conveyor.v1;

option go_package = "github.com/mddemin/conveyor/gen/conveyor/v1;conveyorv1";

// ServerToAgent is one frame pushed to an agent's open stream.
message ServerToAgent {
  oneof payload {
    // Assignment hands the agent a job it now holds a server-side lease on.
    Assignment assignment = 1;

    // CancelJob asks the agent to stop a job it is running. Best effort:
    // the lease expiring is the real deadline.
    CancelJob cancel_job = 3;
  }
}

message Assignment {
  string job_id = 1;
  string type = 2;
  bytes payload = 3;
  int32 attempt = 4; // job.Job.Attempt at lease time; agents echo it verbatim
}

message CancelJob {
  string job_id = 1;
}

// AgentToServer is one frame an agent sends up its open stream.
message AgentToServer {
  oneof payload {
    Heartbeat heartbeat = 1;
    Register register = 2;
    Progress progress = 5;
    Result result = 6;
  }
}

message Heartbeat {}

message Progress {
  string job_id = 1;
  string message = 2;
}

message Result {
  string job_id = 1;
  string error = 2; // empty means success
  int32 attempt = 3; // copied from the Assignment being reported
  bool permanent = 4; // do not retry: the payload, not the run, is the problem
}

// One long-lived stream per agent.
service Conveyor {
  // Assign is the agent's lifeline: the server pushes Assignments,
  // the agent pushes Heartbeats/Progress/Results.
  rpc Assign(stream AgentToServer) returns (stream ServerToAgent);
}

message Register {
  string agent_id = 1; // client-chosen, e.g. "host-pid"
  repeated string capabilities = 2; // types this agent can execute; empty = any
}
