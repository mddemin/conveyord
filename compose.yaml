services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: conveyor
      POSTGRES_USER: conveyor
      POSTGRES_PASSWORD: conveyor
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conveyor"]
      interval: 2s
      timeout: 5s
      retries: 20

  jaeger:
    image: jaegertracing/all-in-one:1.73.0
    ports:
      - "127.0.0.1:16686:16686"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  conveyord:
    build:
      context: .
      target: conveyord
    command:
      - -dsn=postgres://conveyor:conveyor@postgres:5432/conveyor?sslmode=disable
      - -addr=0.0.0.0:8080
      - -grpc-addr=0.0.0.0:50051
      - -pprof=0.0.0.0:6060
      - -max-in-flight=32
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:50051:50051"
      - "127.0.0.1:6060:6060"
    depends_on:
      postgres:
        condition: service_healthy

  agent-a:
    build:
      context: .
      target: agent
    command: ["-server", "conveyord:50051", "-name", "agent-a"]
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      - conveyord
    restart: on-failure

  agent-b:
    build:
      context: .
      target: agent
    command: ["-server", "conveyord:50051", "-name", "agent-b"]
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      - conveyord
    restart: on-failure
