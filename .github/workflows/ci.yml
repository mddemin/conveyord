name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: conveyor
          POSTGRES_USER: conveyor
          POSTGRES_PASSWORD: conveyor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U conveyor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CONVEYOR_TEST_DSN: postgres://conveyor:conveyor@127.0.0.1:5432/conveyor?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: vet
        run: go vet ./...

      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest -checks=all ./...

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed:"; echo "$unformatted"; exit 1
          fi

      - name: test
        run: go test -race ./...
