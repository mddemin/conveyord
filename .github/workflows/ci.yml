name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: conveyor
          POSTGRES_USER: conveyor
          POSTGRES_PASSWORD: conveyor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U conveyor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CONVEYOR_TEST_DSN: postgres://conveyor:conveyor@127.0.0.1:5432/conveyor?sslmode=disable


    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: vet
        run: make vet

      - name: proto lint
        run: go tool buf lint

      - name: proto breaking check
        run: go tool buf breaking proto --against '.git#branch=main,subdir=proto'

      - name: test
        run: go test -race ./...
